<!doctype html>
<html lang="en">
  <head>
    <title>Age Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Age Calculator</h1>

      <h5>Enter your date of birth:</h5>

      <div class="form">
        <input type="date" id="dob" />

        <div class="buttons">
          <button id="calculate">Calculate Age</button>
          <button id="clear">Clear</button>
        </div>
      </div>

      <div id="result">
        <div class="result-title">Your Age</div>

        <div class="age-result">
          <div>
            <span id="years">0</span>
            <small>Years</small>
          </div>

          <div>
            <span id="months">0</span>
            <small>Months</small>
          </div>

          <div>
            <span id="days">0</span>
            <small>Days</small>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
